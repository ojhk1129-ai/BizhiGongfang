name: BizhiGongfang
options:
  bundleIdPrefix: com.wallpaperstudio
  deploymentTarget:
    iOS: "17.0"
targets:
  BizhiGongfang:
    type: application
    platform: iOS
    sources:
      - BizhiGongfang
    entitlements:
      path: BizhiGongfang/BizhiGongfang.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wallpaperstudio.app
        PRODUCT_NAME: BizhiGongfang
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: BizhiGongfang/BizhiGongfang-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 壁纸工坊
        INFOPLIST_KEY_LSRequiresIPhoneOS: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册，选择照片和视频制作壁纸"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要把制作好的 Live Photo 壁纸保存到相册"
        INFOPLIST_KEY_NSMotionUsageDescription: "需要使用陀螺仪，在制作景深壁纸时实时预览视差效果"
